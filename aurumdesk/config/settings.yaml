# ---------------------------------------------------------------------------
# AurumDesk configuration.  Anything omitted falls back to safe defaults in
# aurumdesk/config.py.  Start in paper mode; only flip mode after the desk has
# proven itself for weeks on your demo account.
# ---------------------------------------------------------------------------
mode: paper                # paper | live  (live ALSO needs confirm_live_trading)
confirm_live_trading: false
timezone: UTC

symbols: [XAUUSD, XAUAUD, XAUEUR, XAGUSD, XAGAUD, XAGEUR]
account_currency: USD
timeframes: [M5, M15, H1, H4, D1]
poll_seconds: 20

mt5:
  enabled: true            # auto-attach to a running MT5 terminal (Windows)
  terminal_path: ""        # e.g. C:\Program Files\MetaTrader 5\terminal64.exe
  login: 0                 # 0 = use already-logged-in terminal
  password: ""
  server: ""
  symbol_map:              # map our names to YOUR broker's symbol names!
    XAUUSD: XAUUSD         # common aliases: GOLD, XAUUSD.a, goldm, ...
    XAUAUD: XAUAUD
    XAUEUR: XAUEUR
    XAGUSD: XAGUSD
    XAGAUD: XAGAUD
    XAGEUR: XAGEUR

risk:
  risk_per_trade_pct: 0.75
  daily_loss_limit_pct: 3.0
  weekly_drawdown_halt_pct: 6.0
  max_open_positions: 8
  max_exposure_pct_equity: 30.0
